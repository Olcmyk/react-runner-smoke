name: React static build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, react-runner-smoke]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Report runner
        run: |
          printf 'Runner %s on %s as %s\n' "$RUNNER_NAME" "$(hostname)" "$(whoami)"
      - name: Build and verify the static site
        run: |
          npm ci
          npm run build
          npm run verify
      - name: Upload the static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
