name: React static build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Olcmyk/react-runner-smoke' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, react-runner-smoke]
    timeout-minutes: 10
    steps:
      - name: Download the source for this commit
        run: |
          source_directory="$(mktemp -d "$RUNNER_TEMP/react-source.XXXXXX")"
          archive="$source_directory/source.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 8 --max-time 30 \
            --output "$archive" "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA"
          tar --extract --gzip --file "$archive" --directory "$source_directory" --strip-components=1
          printf 'REACT_SOURCE_DIRECTORY=%s\n' "$source_directory" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Report runner
        run: |
          printf 'Runner %s (%s %s)\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - name: Build and verify the static site
        working-directory: ${{ env.REACT_SOURCE_DIRECTORY }}
        run: |
          npm ci
          npm run build
          npm run verify
      - name: Upload the static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-static-site
          path: ${{ env.REACT_SOURCE_DIRECTORY }}/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish static files
        working-directory: ${{ env.REACT_SOURCE_DIRECTORY }}
        run: |
          site_directory=/srv/react-runner-smoke/www
          cp -R dist/assets/. "$site_directory/assets/"
          pending_page="$(mktemp "$site_directory/.index.XXXXXX")"
          trap 'rm -f "$pending_page"' EXIT
          install -m 0644 dist/index.html "$pending_page"
          mv -fT "$pending_page" "$site_directory/index.html"
